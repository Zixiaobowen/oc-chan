[workspace]
resolver = "2"
members = ["crates/oc-core", "crates/oc-plugin-sdk", "crates/oc-installer", "plugins/system-monitor", "native", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
semver = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
regex = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "functions", "fallible_uint"] }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
plist = "1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
