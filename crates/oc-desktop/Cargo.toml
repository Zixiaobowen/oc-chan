[package]
name = "oc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "oc-chan"
path = "src/main.rs"

[features]
default = []
acceptance = ["oc-core/acceptance", "oc-installer/acceptance"]

[dependencies]
oc-core = { path = "../oc-core" }
oc-installer = { path = "../oc-installer" }
oc-native-bridge = { path = "../../native" }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "0.21", default-features = false }
async-channel = "2"
anyhow = "1"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
uuid.workspace = true
libc.workspace = true
sha2.workspace = true
base64.workspace = true
chrono.workspace = true
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSEvent", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSObject", "block2"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }

[build-dependencies]
sha2.workspace = true
cc = "1"

[dev-dependencies]
tempfile.workspace = true
