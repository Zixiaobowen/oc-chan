name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            macho-arch: arm64
            app-directory: mac-arm64
          - runner: macos-15-intel
            arch: x64
            macho-arch: x86_64
            app-directory: mac
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TARGET_ARCH: ${{ matrix.arch }}
      MACHO_ARCH: ${{ matrix.macho-arch }}
      APP_DIRECTORY: release/${{ matrix.app-directory }}/OC Chan.app

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify native toolchain
        run: |
          node -e 'if (process.platform !== "darwin" || process.arch !== process.env.TARGET_ARCH) throw new Error(`Expected macOS ${process.env.TARGET_ARCH}, got ${process.platform} ${process.arch}`)'
          xcrun --find swiftc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build DMG and ZIP
        run: npm run dist -- "--$TARGET_ARCH"

      - name: Verify packaged application
        run: |
          test -f "$APP_DIRECTORY/Contents/Resources/app.asar"
          test -x "$APP_DIRECTORY/Contents/Resources/tern-navigation/present-window"
          lipo "$APP_DIRECTORY/Contents/MacOS/OC Chan" -verify_arch "$MACHO_ARCH"
          lipo "$APP_DIRECTORY/Contents/Resources/tern-navigation/present-window" -verify_arch "$MACHO_ARCH"

      - name: Generate and verify checksums
        working-directory: release
        run: |
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
