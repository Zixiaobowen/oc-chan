name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TARGET_ARCH: arm64
      MACHO_ARCH: arm64
      APP_DIRECTORY: ${{ github.workspace }}/release/mac-arm64/OC Chan.app

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preflight signed release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_RELEASE_TOKEN: ${{ secrets.UPDATE_RELEASE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`Release tag must match package version v${version}`)
          const required = ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID', 'UPDATE_RELEASE_TOKEN']
          const missing = required.filter(name => !process.env[name]?.trim())
          if (missing.length) throw new Error(`Missing required release secrets: ${missing.join(', ')}`)
          NODE

      - name: Verify native toolchain
        run: |
          node -e 'if (process.platform !== "darwin" || process.arch !== process.env.TARGET_ARCH) throw new Error(`Expected macOS ${process.env.TARGET_ARCH}, got ${process.platform} ${process.arch}`)'
          xcrun --find swiftc
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run affected behavior tests
        id: behavior_tests
        env:
          OC_CHAN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:ci

      - name: Install locked Electron runtime
        if: steps.behavior_tests.outputs.renderer_smoke == 'true'
        run: npm exec -- install-electron

      - name: Run isolated Electron renderer smoke
        id: renderer_smoke
        if: steps.behavior_tests.outputs.renderer_smoke == 'true'
        timeout-minutes: 8
        run: npm run smoke:renderer -- --out "$RUNNER_TEMP/oc-chan-renderer-smoke"

      - name: Upload renderer smoke evidence
        if: ${{ !cancelled() && (steps.renderer_smoke.outcome == 'success' || steps.renderer_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-renderer-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/oc-chan-renderer-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned DMG and ZIP
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: npm run dist -- "--$TARGET_ARCH"

      - name: Build signed and notarized DMG and ZIP
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_RELEASE_TOKEN: ${{ secrets.UPDATE_RELEASE_TOKEN }}
        run: npm run dist -- "--$TARGET_ARCH"

      - name: Verify packaged application
        run: |
          test -f "$APP_DIRECTORY/Contents/Resources/app.asar"
          test -f "$APP_DIRECTORY/Contents/Resources/app-update.yml"
          test -x "$APP_DIRECTORY/Contents/Resources/tern-navigation/present-window"
          lipo "$APP_DIRECTORY/Contents/MacOS/OC Chan" -verify_arch "$MACHO_ARCH"
          lipo "$APP_DIRECTORY/Contents/Resources/tern-navigation/present-window" -verify_arch "$MACHO_ARCH"
          node --input-type=module -e 'import { access } from "node:fs/promises"; import { packageReleaseInfo } from "./scripts/release-config.mjs"; await access(`release/${packageReleaseInfo().metadataName}`)'
      - name: Review dependency licenses and advisories
        run: npm run audit:dependencies -- --output "release/dependency-review-$TARGET_ARCH.json"

      - name: Verify package contents and frozen size budgets
        run: npm run check:package -- --app "$APP_DIRECTORY" --arch "$TARGET_ARCH" --artifacts-dir release --output "release/package-manifest-$TARGET_ARCH.json"

      - name: Verify Developer ID signature and notarization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          requirement="anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict --verbose=2 "$APP_DIRECTORY"
          codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY"
          codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY/Contents/Resources/tern-navigation/present-window"
          codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY/Contents/Resources/liquid-glass/liquid-glass.node"
          codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY/Contents/Resources/notification-permission/notification-permission.node"
          xcrun stapler validate "$APP_DIRECTORY"
          spctl --assess --type execute --verbose=2 "$APP_DIRECTORY"

      - name: Generate and verify checksums
        working-directory: release
        run: |
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-macos-arm64-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/*-mac.yml
            release/SHA256SUMS.txt
            release/package-manifest-arm64.json
            release/dependency-review-arm64.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish public update release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out release preparation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release script dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download separate architecture artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oc-chan-macos-*-${{ github.run_number }}
          path: artifacts
          merge-multiple: false

      - name: Validate and merge update metadata
        run: node scripts/prepare-release.mjs artifacts release-assets "$GITHUB_RUN_NUMBER" "$RELEASE_TAG"

      - name: Upload draft and publish complete release
        env:
          UPDATE_RELEASE_TOKEN: ${{ secrets.UPDATE_RELEASE_TOKEN }}
        run: node scripts/publish-release.mjs release-assets "$RELEASE_TAG"
