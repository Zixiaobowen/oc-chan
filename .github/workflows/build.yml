name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Rust arm64 and real WebKit acceptance
    # Official arm64 macOS 26 image: https://github.com/actions/runner-images#available-images
    # Native acceptance input needs macOS 26; the production deployment target stays 13.0.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preflight signed release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node --input-type=module -e 'import {packageReleaseInfo,requireReleaseEnvironment} from "./scripts/release-config.mjs";requireReleaseEnvironment(packageReleaseInfo())'

      - name: Verify native WebKit acceptance environment
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Native arm64 macOS runner required')
          const major = Number(execFileSync('sw_vers', ['-productVersion'], { encoding: 'utf8' }).trim().split('.')[0])
          if (!Number.isInteger(major) || major < 26) throw new Error('Real native WebKit input acceptance requires macOS 26; this does not change production macOS 13 support')
          NODE
          xcrun --find swiftc
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-version
          rustup toolchain install 1.99.0 --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/oc-audit-tools"
          printf '%s\n' "$RUNNER_TEMP/oc-audit-tools/bin" >> "$GITHUB_PATH"

      - name: Import release identity into a job-owned temporary keychain
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          oc_signing_key="$(openssl rand -hex 32)"
          echo "::add-mask::$oc_signing_key"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/oc-release.p12"
          chmod 600 "$RUNNER_TEMP/oc-release.p12"
          security create-keychain -p "$oc_signing_key" "$RUNNER_TEMP/oc-release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/oc-release.keychain-db"
          security unlock-keychain -p "$oc_signing_key" "$RUNNER_TEMP/oc-release.keychain-db"
          security import "$RUNNER_TEMP/oc-release.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$RUNNER_TEMP/oc-release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$oc_signing_key" "$RUNNER_TEMP/oc-release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/oc-release.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/oc-release.p12"

      - name: Install frontend and tooling dependencies
        run: npm ci --no-audit --no-fund

      - name: Check frontend IPC types
        run: npm run typecheck

      - name: Run affected Rust and JavaScript behavior tests
        id: behavior_tests
        env:
          OC_CHAN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:ci

      - name: Run isolated real WKWebView acceptance
        id: renderer_smoke
        if: steps.behavior_tests.outputs.renderer_smoke == 'true'
        timeout-minutes: 30
        run: npm run smoke:renderer -- --out "$RUNNER_TEMP/oc-chan-renderer-smoke"

      - name: Upload real WebKit acceptance evidence
        if: ${{ !cancelled() && (steps.renderer_smoke.outcome == 'success' || steps.renderer_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-renderer-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/oc-chan-renderer-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Build ad-hoc signed Rust DMG and ZIP
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: npm run dist -- --arm64

      - name: Build Developer ID signed and notarized Rust DMG and ZIP
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --arm64

      - name: Bind artifact paths to the completed Rust distribution
        id: distribution
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import path from 'node:path'
          import { ROOT, loadBuild, boundedJson } from './scripts/build-app.mjs'
          const build = await loadBuild(), directory = path.join(ROOT, 'release/tauri', build.buildId)
          const record = await boundedJson(path.join(directory, 'distribution.json'))
          if (record.schema !== 2 || record.buildId !== build.buildId || record.destination !== directory || record.arch !== 'arm64' || record.version !== build.version) throw new Error('Distribution does not match this build')
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=${directory}\napp=${record.app}\n`)
          NODE

      - name: Review exact npm and Cargo locks, licenses and advisories
        env:
          DISTRIBUTION_DIRECTORY: ${{ steps.distribution.outputs.directory }}
        run: npm run audit:dependencies -- --bundled-manifest out/renderer/bundled-dependencies.json --output "$DISTRIBUTION_DIRECTORY/dependency-review-arm64.json"

      - name: Verify native package, complete licenses and absence of acceptance code
        env:
          APP_DIRECTORY: ${{ steps.distribution.outputs.app }}
          DISTRIBUTION_DIRECTORY: ${{ steps.distribution.outputs.directory }}
        run: npm run check:package -- --app "$APP_DIRECTORY" --arch arm64 --artifacts-dir "$DISTRIBUTION_DIRECTORY" --output "$DISTRIBUTION_DIRECTORY/package-manifest-arm64.json"

      - name: Verify Developer ID team and notarization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APP_DIRECTORY: ${{ steps.distribution.outputs.app }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          requirement="=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict --verbose=2 "$APP_DIRECTORY"
          codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY"
          for helper in oc-data-worker oc-installer tern-navigation/present-window; do
            codesign --verify --strict --verbose=2 -R "$requirement" "$APP_DIRECTORY/Contents/Resources/$helper"
          done
          xcrun stapler validate "$APP_DIRECTORY"
          spctl --assess --type execute --verbose=2 "$APP_DIRECTORY"

      - name: Generate attachment checksums
        env:
          DISTRIBUTION_DIRECTORY: ${{ steps.distribution.outputs.directory }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { packageReleaseInfo } from './scripts/release-config.mjs'
          import { digestFile } from './scripts/build-app.mjs'
          const {version} = packageReleaseInfo(), directory = process.env.DISTRIBUTION_DIRECTORY, lines = []
          for (const extension of ['zip', 'dmg']) {
            const name = `OC-Chan-${version}-mac-arm64.${extension}`
            lines.push(`${(await digestFile(path.join(directory, name))).digest}  ${name}\n`)
          }
          await writeFile(path.join(directory, 'SHA256SUMS.txt'), lines.join(''), {flag: 'wx', mode: 0o600})
          NODE

      - name: Upload checked Rust distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-macos-arm64-${{ github.run_number }}
          path: |
            ${{ steps.distribution.outputs.directory }}/*.dmg
            ${{ steps.distribution.outputs.directory }}/*.zip
            ${{ steps.distribution.outputs.directory }}/latest.json
            ${{ steps.distribution.outputs.directory }}/SHA256SUMS.txt
            ${{ steps.distribution.outputs.directory }}/package-manifest-arm64.json
            ${{ steps.distribution.outputs.directory }}/dependency-review-arm64.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove only this job's signing material
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          if test -f "$RUNNER_TEMP/oc-release.p12"; then rm "$RUNNER_TEMP/oc-release.p12"; fi
          if test -f "$RUNNER_TEMP/oc-release.keychain-db"; then security delete-keychain "$RUNNER_TEMP/oc-release.keychain-db"; fi

  release:
    name: Publish checked macOS installers
    needs: build
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: oc-chan-public-release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve release channel and source commit
        id: publication
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { packageReleaseInfo, publicationInfo } from './scripts/release-config.mjs'
          const info = publicationInfo(packageReleaseInfo().version)
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${info.tag}\n`)
          NODE
      - name: Download checked arm64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oc-chan-macos-arm64-${{ github.run_number }}
          path: artifacts
          merge-multiple: false
      - name: Rehash attachments and stage channel-specific assets
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
        run: node scripts/prepare-release.mjs artifacts release-assets "$GITHUB_RUN_NUMBER" "$RELEASE_TAG"
      - name: Upload draft and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
        run: |
          node scripts/publish-release.mjs release-assets "$RELEASE_TAG"
          printf 'Release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
