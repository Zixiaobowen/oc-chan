name: Build macOS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TARGET_ARCH: arm64
      APP_DIRECTORY: release/mac-arm64/OC Chan.app

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must match package version ${expected}`)'

      - name: Verify native toolchain
        run: |
          node -e 'if (process.platform !== "darwin" || process.arch !== process.env.TARGET_ARCH) throw new Error(`Expected macOS ${process.env.TARGET_ARCH}, got ${process.platform} ${process.arch}`)'
          xcrun --find swiftc
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run affected behavior tests
        id: behavior_tests
        env:
          OC_CHAN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:ci

      - name: Install locked Electron runtime
        if: steps.behavior_tests.outputs.renderer_smoke == 'true'
        run: npm exec -- install-electron

      - name: Run isolated Electron renderer smoke
        id: renderer_smoke
        if: steps.behavior_tests.outputs.renderer_smoke == 'true'
        timeout-minutes: 8
        run: npm run smoke:renderer -- --out "$RUNNER_TEMP/oc-chan-renderer-smoke"

      - name: Upload renderer smoke evidence
        if: ${{ !cancelled() && (steps.renderer_smoke.outcome == 'success' || steps.renderer_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-renderer-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/oc-chan-renderer-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Build DMG and ZIP
        run: npm run dist

      - name: Review dependency licenses and advisories
        run: npm run audit:dependencies -- --output "release/dependency-review-$TARGET_ARCH.json"

      - name: Verify package contents and frozen size budgets
        run: npm run check:package -- --app "$APP_DIRECTORY" --arch "$TARGET_ARCH" --artifacts-dir release --output "release/package-manifest-$TARGET_ARCH.json"

      - name: Generate and verify checksums
        working-directory: release
        run: |
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-chan-macos-arm64-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/package-manifest-arm64.json
            release/dependency-review-arm64.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oc-chan-macos-*-${{ github.run_number }}
          path: artifacts
          merge-multiple: false

      - name: Prepare and verify release assets
        run: |
          mkdir release-assets
          artifact="artifacts/oc-chan-macos-arm64-$GITHUB_RUN_NUMBER"
          for extension in dmg zip; do
            asset="$artifact/OC-Chan-${RELEASE_TAG#v}-mac-arm64.$extension"
            test -s "$asset"
            mv "$asset" release-assets/
          done
          cp "$artifact/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          cd release-assets
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          options=(--verify-tag --title "OC Chan $RELEASE_TAG" --generate-notes)
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip release-assets/SHA256SUMS.txt "${options[@]}"
