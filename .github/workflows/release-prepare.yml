name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Product version increment
        required: true
        type: choice
        options: [patch, minor, major]
      notes:
        description: Release notes (Markdown)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: oc-chan-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain for version metadata
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Bump version, open release PR and dispatch validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/release-workflow.mjs prepare
