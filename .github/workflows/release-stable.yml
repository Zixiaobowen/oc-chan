name: Release stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact product version already merged into main (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: oc-chan-release-stable
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain for version metadata
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Validate version and signing, create immutable tag and dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: node scripts/release-workflow.mjs stable
